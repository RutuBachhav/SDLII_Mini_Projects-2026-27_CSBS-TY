# ---------------------------------------------------------------------------
# DeadlineBuddy configuration
#
# This is the only place the application reads settings from. It is compiled
# into WEB-INF/classes/deadlinebuddy.properties.
#
# Every key is resolved in this order (first hit wins):
#
#   1. JVM system property        -Djdbc.url=...
#   2. environment variable       DEADLINEBUDDY_JDBC_URL=...
#   3. this file
#   4. the default built into com.util.Config
#
# So you can override the password on a lab machine without editing a file:
#   set DEADLINEBUDDY_JDBC_PASSWORD=something-else
# ---------------------------------------------------------------------------

jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/deadlinebuddy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
jdbc.user=root
jdbc.password=Gsh141shivtej#

# Connection pool used by EclipseLink for this resource-local persistence unit.
jdbc.pool.min=2
jdbc.pool.max=20

# Schema handling. Leave at "none": db/schema.sql is the authoritative schema.
# "create-or-extend-tables" lets EclipseLink create missing tables itself, which
# is handy for a first run but will not reproduce the CHECK constraints.
jpa.ddl=none

# EclipseLink log level: OFF, SEVERE, WARNING, INFO, CONFIG, FINE, FINEST, ALL
jpa.log.level=WARNING

# PBKDF2-HMAC-SHA256 cost for new passwords. Existing hashes keep the
# iteration count they were created with, so this can be raised safely.
security.pbkdf2.iterations=210000

# Session idle timeout, in minutes.
session.timeout.minutes=60
