# FoundIt configuration
#
# This file is the only place that holds a connection string, a password or a
# storage path. It is packaged into WEB-INF/classes, so after a build you can
# also edit it inside the deployed application.
#
# Every key below can be overridden without touching this file, which is useful
# on a shared machine:
#   as a JVM option      -Dfoundit.db.password=secret
#   as an environment variable  FOUNDIT_DB_PASSWORD=secret
# The JVM option wins, then the environment variable, then this file.

# ----------------------------------------------------------------- database
foundit.db.driver=com.mysql.cj.jdbc.Driver
foundit.db.url=jdbc:mysql://localhost:3306/foundit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
foundit.db.user=root
foundit.db.password=123456789

# ----------------------------------------------------------------- photo storage
#
# Absolute path to this project's uploads folder. It sits next to src/ and web/,
# outside the web content, so a clean build or a redeploy never deletes it and no
# file is reachable by URL: photographs are streamed by PhotoServlet instead.
#
# Change this one line if you move or rename the project. If it is left empty,
# FoundIt falls back to ${user.home}/.foundit/uploads so the application still
# runs, and the report form says where photographs are going.
foundit.storage.dir=D:/Java college lab/FoundIt/uploads
